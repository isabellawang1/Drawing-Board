<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drawing Board</title>
  <link rel="icon" href="data:,">
  <script src="app.js?v=toolbox-2" defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      font: 14px system-ui, sans-serif;
      color: #252525;
      background: #fff;
      color-scheme: light;
    }
    aside {
      width: 184px;
      flex-shrink: 0;
      padding: 24px 0;
      background: #000;
      color: #fff;
      overflow-y: auto;
    }
    h1 { margin: 0 20px 28px; font-size: 15px; font-weight: 600; }
    fieldset { margin: 0; padding: 0; border: 0; }
    legend { margin: 0 20px 10px; color: #999; font-size: 12px; }
    label { display: block; position: relative; cursor: pointer; }
    label + label { border-top: 1px solid #333; }
    input[type="radio"] { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .tool, button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 16px 20px;
      border: 0;
      border-radius: 0;
      font: inherit;
      color: #bbb;
      background: transparent;
      text-align: left;
    }
    label:hover .tool, button:hover { color: #fff; }
    input:checked + .tool { color: #fff; font-weight: 600; }
    input:focus-visible + .tool, button:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
    svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    button { cursor: pointer; border-top: 1px solid #333; }
    .colors { margin-top: 24px; }
    .palette { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 12px; }
    .palette label { display: grid; place-items: center; min-height: 44px; border: 0; }
    .swatch { width: 24px; height: 24px; border-radius: 50%; background: var(--color); border: 1px solid #777; }
    input:checked + .swatch { outline: 2px solid #fff; outline-offset: 3px; }
    input:focus-visible + .swatch { outline: 2px dashed #fff; outline-offset: 5px; }
    .brush-width { margin: 24px 20px 0; padding-top: 20px; border-top: 1px solid #333; }
    .width-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: #999; }
    .width-heading output { color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
    input[type="range"] { display: block; width: 100%; height: 32px; margin: 8px 0 0; accent-color: #fff; color-scheme: dark; cursor: pointer; }
    input[type="range"]:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    main { flex: 1; min-width: 0; position: relative; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    @media (max-width: 480px) {
      aside { width: 148px; padding: 20px 0; }
      h1 { margin-left: 16px; font-size: 14px; }
      legend { margin-left: 16px; }
      .tool, button { padding-left: 16px; padding-right: 16px; }
      .brush-width { margin-left: 16px; margin-right: 16px; }
    }
  </style>
</head>
<body>
  <aside aria-label="Drawing tools">
    <h1>Your very own drawing board! </h1>
    <fieldset disabled>
      <legend>Tools</legend>
      <label>
        <input type="radio" name="tool" value="marker" checked>
        <span class="tool">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6-9 9H5v-6Z"/><path d="m12 6 6 6M5 19l-2 2h6"/></svg>
          Marker
        </span>
      </label>
      <label>
        <input type="radio" name="tool" value="highlighter">
        <span class="tool">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7-9 9-7-7Z"/><path d="m5 12-2 7 4 2 5-2M3 21h10"/></svg>
          Highlighter
        </span>
      </label>
      <label>
        <input type="radio" name="tool" value="eraser">
        <span class="tool">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7-10 10H6l-4-4Z"/><path d="m8 10 7 7M11 20h10"/></svg>
          Eraser
        </span>
      </label>
    </fieldset>
    <button id="clear" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>
      Clear All
    </button>
    <fieldset class="colors">
      <legend>Color</legend>
      <div class="palette">
        <label title="Black">
          <input type="radio" name="color" value="#000000" aria-label="Black" checked>
          <span class="swatch" style="--color: #000000" aria-hidden="true"></span>
        </label>
        <label title="Red">
          <input type="radio" name="color" value="#ef4444" aria-label="Red">
          <span class="swatch" style="--color: #ef4444" aria-hidden="true"></span>
        </label>
        <label title="Orange">
          <input type="radio" name="color" value="#f97316" aria-label="Orange">
          <span class="swatch" style="--color: #f97316" aria-hidden="true"></span>
        </label>
        <label title="Green">
          <input type="radio" name="color" value="#22c55e" aria-label="Green">
          <span class="swatch" style="--color: #22c55e" aria-hidden="true"></span>
        </label>
        <label title="Blue">
          <input type="radio" name="color" value="#3b82f6" aria-label="Blue">
          <span class="swatch" style="--color: #3b82f6" aria-hidden="true"></span>
        </label>
        <label title="Purple">
          <input type="radio" name="color" value="#a855f7" aria-label="Purple">
          <span class="swatch" style="--color: #a855f7" aria-hidden="true"></span>
        </label>
      </div>
    </fieldset>
    <div class="brush-width">
      <div class="width-heading">
        <label for="brush-width">Brush width</label>
        <output id="width-value" for="brush-width">5 px</output>
      </div>
      <input id="brush-width" type="range" min="1" max="50" step="1" value="5" aria-valuetext="5 pixels">
    </div>
  </aside>
  <main aria-label="Drawing area">
    <canvas aria-label="Drag to draw with the selected tool."></canvas>
  </main>
</body>
</html>
